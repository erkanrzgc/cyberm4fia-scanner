# Integration-test fixture environment.
#
# Brings up the local services the real-binary integration tests need.
# Bring up + run + tear down:
#
#   docker compose -f docker-compose.integration.yml up -d
#   pytest -m integration tests/integration/ -v
#   docker compose -f docker-compose.integration.yml down -v
#
# Or via Make: `make integration-up` / `make integration-test` / `make integration-down`.

services:
  # 1. TLS server with a known-weak protocol set — for sslyze + testssl.
  #    Bitnami nginx with TLSv1.0+1.1 enabled deliberately.
  weak-tls:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./tests/integration/fixtures/weak-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tests/integration/fixtures/tls:/etc/nginx/tls:ro
    command: ["nginx", "-g", "daemon off;"]

  # 2. WordPress for wpscan. A modern version still has known plugin/theme
  #    vulnerabilities the database flags; tests assert "at least one vuln".
  wordpress:
    image: wordpress:6.4-php8.1-apache
    ports:
      - "127.0.0.1:8080:80"
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wp
    depends_on:
      - wp-db

  wp-db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wp
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass

  # 3. Samba server with a public READ share + a writable share. smbmap target.
  samba:
    image: dperson/samba
    ports:
      - "127.0.0.1:1445:445"
    command: >
      -s "public;/share/public;yes;no;yes;all;none;all"
      -s "writable;/share/writable;yes;no;no;all;all;all"
      -p
    volumes:
      - samba-public:/share/public
      - samba-writable:/share/writable

  # 4. Generic HTTP target for gowitness. Anything that returns a <title>.
  http-target:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./tests/integration/fixtures/http-root:/usr/share/nginx/html:ro

  # 5. Kubernetes cluster for kube-hunter. We use kind-in-docker.
  #    NOTE: this profile is opt-in because kind needs privileged + cgroupv2.
  kind:
    profiles: ["kube"]
    image: kindest/node:v1.30.0
    privileged: true
    ports:
      - "127.0.0.1:6443:6443"

volumes:
  samba-public:
  samba-writable:
