# Release pipeline — builds and publishes the Docker image to GHCR
# whenever a `v*` tag is pushed (or manually via workflow_dispatch).
#
# Result: `ghcr.io/erkanrzgc/cyberm4fia-scanner:<tag>` + `:latest`.
# First-run UX after publish:
#   docker run --rm -e NVIDIA_API_KEY=$KEY \
#     ghcr.io/erkanrzgc/cyberm4fia-scanner:latest -u https://target/ --all --ai

name: Release Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write     # ghcr.io publish

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only for now — the bundled Playwright Chromium and
          # nmap make multi-arch noticeably slower and few users need arm64.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
