# cyberm4fia-scanner Security Scan — GitHub Actions CI/CD Pipeline
# Place this file at: .github/workflows/security-scan.yml
#
# Triggers:
#   - On every push to main/master
#   - On every pull request
#   - Manual trigger via workflow_dispatch
#
# Usage:
#   1. Copy this file to your project's .github/workflows/ directory
#   2. Set the TARGET_URL secret in your GitHub repo settings
#   3. Push to trigger the scan

name: cyberm4fia-scanner Security Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
        type: string
      scan_mode:
        description: 'Scan mode (1-Quick, 2-Normal, 3-Aggressive)'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

env:
  SCANNER_DIR: cyberm4fia-scanner

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Scanner
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: ${{ env.SCANNER_DIR }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd ${{ env.SCANNER_DIR }}
          pip install -r requirements.txt || pip install requests beautifulsoup4 rich

      - name: Run Security Scan
        id: scan
        # Capture scanner exit code so we can branch CI on severity tier.
        # SCAN_EXIT_THRESHOLD controls which severities count as failure
        # (critical=1 only, high=1+2, medium=1+2+3, low=any). Default: high.
        env:
          SCAN_EXIT_THRESHOLD: ${{ vars.SCAN_EXIT_THRESHOLD || 'high' }}
        continue-on-error: true
        run: |
          cd ${{ env.SCANNER_DIR }}

          TARGET="${{ github.event.inputs.target_url || secrets.TARGET_URL }}"
          MODE="${{ github.event.inputs.scan_mode || '2' }}"

          if [ -z "$TARGET" ]; then
            echo "::error::No target URL provided. Set TARGET_URL secret or use workflow_dispatch."
            exit 1
          fi

          echo "🔍 Scanning: $TARGET (Mode: $MODE, exit-threshold: $SCAN_EXIT_THRESHOLD)"

          set +e
          python3 scanner.py -u "$TARGET" -m "$MODE" \
            --xss --sqli --lfi --ssrf --tech \
            --json --html --sarif --quiet
          SCANNER_CODE=$?
          set -e
          echo "scanner_exit_code=$SCANNER_CODE" >> $GITHUB_OUTPUT
          case "$SCANNER_CODE" in
            0)  echo "✅ Scan clean (no findings at threshold)";;
            1)  echo "🛑 CRITICAL findings detected";;
            2)  echo "🔴 HIGH findings detected";;
            3)  echo "🟠 MEDIUM findings detected";;
            4)  echo "🟡 LOW/INFO findings detected";;
            10) echo "::error::Scanner internal error";;
            *)  echo "Scanner exited with code $SCANNER_CODE";;
          esac

          SCAN_DIR=$(ls -td scans/*/ 2>/dev/null | head -1)
          if [ -d "$SCAN_DIR" ]; then
            echo "scan_dir=$SCAN_DIR" >> $GITHUB_OUTPUT
            if [ -f "$SCAN_DIR/findings.json" ]; then
              VULN_COUNT=$(python3 -c "import json,sys; d=json.load(open('$SCAN_DIR/findings.json')); print(len(d.get('findings',[])))" 2>/dev/null || echo "0")
              echo "vuln_count=$VULN_COUNT" >> $GITHUB_OUTPUT
              echo "📊 Found $VULN_COUNT finding(s)"
            fi
            # Make SARIF path available to the upload step
            if [ -f "$SCAN_DIR/results.sarif" ]; then
              echo "sarif_path=$SCAN_DIR/results.sarif" >> $GITHUB_OUTPUT
            fi
            if [ -f "$SCAN_DIR/issues.burp.xml" ]; then
              echo "burp_xml_path=$SCAN_DIR/issues.burp.xml" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always() && steps.scan.outputs.sarif_path != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.SCANNER_DIR }}/${{ steps.scan.outputs.sarif_path }}
          category: cyberm4fia-scanner
        continue-on-error: true

      - name: Upload Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyberm4fia-scan-report
          path: |
            ${{ env.SCANNER_DIR }}/scans/
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.scan.outputs.vuln_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const vulnCount = '${{ steps.scan.outputs.vuln_count }}';
            const body = `## 🛡️ cyberm4fia-scanner Security Scan Results

            ⚠️ **${vulnCount} vulnerability(ies) detected!**

            The security scan found potential issues in this PR.
            Please review the scan report in the Actions artifacts.

            | Detail | Value |
            |---|---|
            | Vulnerabilities | ${vulnCount} |
            | Scan Mode | ${{ github.event.inputs.scan_mode || '2' }} |
            | Target | ${{ github.event.inputs.target_url || secrets.TARGET_URL }} |

            📎 [Download Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Gate build on severity
        # Re-emit the scanner's exit code so the workflow status reflects it.
        # The scan step is `continue-on-error: true` so artifacts/SARIF still
        # upload even when this step fails.
        run: |
          CODE="${{ steps.scan.outputs.scanner_exit_code }}"
          if [ -z "$CODE" ] || [ "$CODE" = "0" ]; then
            echo "✅ No findings at configured severity threshold."
            exit 0
          fi
          echo "::warning::Scanner exited $CODE — see SARIF / artifacts for details."
          exit "$CODE"
