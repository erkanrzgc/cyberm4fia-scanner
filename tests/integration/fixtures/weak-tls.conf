# Deliberate weak-TLS server config — for sslyze / testssl integration tests.
# Enables TLSv1.0 and TLSv1.1 so the wrappers' "weak protocol" findings fire.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers         ALL:!aNULL;
    ssl_prefer_server_ciphers on;

    location / {
        return 200 "weak-tls fixture\n";
    }
}
